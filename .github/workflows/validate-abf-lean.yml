name: Validate ABF-001 Lean formalization

on:
  push:
    branches:
      - formal/abf-full-lean-v2
  pull_request:
    branches:
      - main
    paths:
      - 'papers/ABF-001/formal/**'
      - 'papers/ABF-001/FORMAL_VERIFICATION.md'
      - 'formal-verification-status.json'
      - 'FULL_LEAN_VERIFICATION_PROGRAM.md'
      - 'tools/validate_full_lean_portfolio.py'
      - '.github/workflows/validate-abf-lean.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Immutable commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out ABF formal source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact workflow checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            expected="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            expected="${{ inputs.target_sha }}"
          else
            expected="${{ github.sha }}"
          fi
          actual="$(git rev-parse HEAD)"
          echo "event=${{ github.event_name }}"
          echo "expected_sha=$expected"
          echo "actual_checked_out_sha=$actual"
          test "$actual" = "$expected"
          mkdir -p .artifacts/exact-head
          python - <<PY
          import json
          from pathlib import Path

          payload = {
              "schema": "nhaim.workflow_exact_head_checkout.v1",
              "event": "${{ github.event_name }}",
              "expected_sha": "$expected",
              "actual_checked_out_sha": "$actual",
              "match": "$actual" == "$expected",
          }
          path = Path(".artifacts/exact-head/${{ github.job }}-checkout.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Reject proof placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          formal='papers/ABF-001/formal'
          if grep -RInE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' \
              "$formal" --include='*.lean' --exclude-dir='.lake'; then
            echo 'Lean placeholder found.' >&2
            exit 1
          fi
          if grep -RInE '^[[:space:]]*axiom[[:space:]]' \
              "$formal" --include='*.lean' --exclude-dir='.lake'; then
            echo 'Project axiom declaration found.' >&2
            exit 1
          fi

      - name: Install pinned Lean toolchain manager
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/abf-lean
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://raw.githubusercontent.com/leanprover/elan/v4.2.1/elan-init.sh \
            -o /tmp/elan-init.sh
          sha256sum /tmp/elan-init.sh \
            | tee .artifacts/abf-lean/elan-installer-sha256.txt
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" --version \
            | tee .artifacts/abf-lean/elan-version.txt

      - name: Resolve dependencies and build ABF declarations
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd papers/ABF-001/formal
          lake --version 2>&1 \
            | tee ../../../.artifacts/abf-lean/lake-version.txt
          lake update 2>&1 \
            | tee ../../../.artifacts/abf-lean/lake-update.log
          sha256sum lake-manifest.json \
            | tee ../../../.artifacts/abf-lean/lake-manifest-sha256.txt
          lake exe cache get 2>&1 \
            | tee ../../../.artifacts/abf-lean/cache.log
          lake build 2>&1 \
            | tee ../../../.artifacts/abf-lean/build.log

      - name: Write bounded formal receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('papers/ABF-001/formal')
          artifact = Path('.artifacts/abf-lean')
          files = [root / 'ABF.lean', *sorted((root / 'ABF').rglob('*.lean'))]
          source = '\n'.join(path.read_text(encoding='utf-8') for path in files)
          build = (artifact / 'build.log').read_text(encoding='utf-8')
          manifest = root / 'lake-manifest.json'
          declarations = re.compile(
              r'^\s*(?:theorem|lemma|def|abbrev|structure|inductive)\s+',
              re.MULTILINE,
          )

          assert all(path.is_file() for path in files)
          assert 'sorryAx' not in build
          assert manifest.is_file()
          receipt = {
              'schema': 'n.human_ai_mathematics.abf001.lean_build.v1',
              'result': 'PASS',
              'exact_head': "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}",
              'toolchain': (root / 'lean-toolchain').read_text().strip(),
              'mathlib_request': 'v4.30.0',
              'lake_manifest_sha256': hashlib.sha256(manifest.read_bytes()).hexdigest(),
              'lean_files': [str(path) for path in files],
              'compiled_source_declaration_count': len(declarations.findall(source)),
              'sorry_admit_count': 0,
              'project_axiom_count': 0,
              'sorryAx_in_build_log': False,
              'formal_lanes_complete': {
                  'A01': True,
                  'A02': False,
                  'A03': False,
                  'A04': False,
                  'A05': False,
                  'A06': False,
              },
              'full_manuscript_lean_verified': False,
              'existing_public_formal_pass_claim': False,
          }
          (artifact / 'ABF001_LEAN_BUILD_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Validate ABF status and portfolio boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/abf-lean
          python tools/validate_full_lean_portfolio.py \
            --root . \
            --output .artifacts/abf-lean/portfolio-validation.json \
            | tee .artifacts/abf-lean/portfolio-validation.stdout

      - name: Check ABF formal branch whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            git fetch origin "${{ github.base_ref }}"
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
            git diff --check "$base" HEAD --
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD --
          else
            git diff --check --
          fi

      - name: Upload ABF Lean receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: abf001-lean-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          path: |
            .artifacts/abf-lean/
            .artifacts/exact-head/
          if-no-files-found: error
          retention-days: 90
