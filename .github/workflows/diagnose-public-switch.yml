name: Diagnose public-switch candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize diagnostic file
        run: |
          mkdir -p reports
          printf 'Public-switch diagnostic\ncommit=%s\nrun=%s\n\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > reports/public-switch-diagnostic.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete diagnostic without early exit
        id: diagnostic
        shell: bash
        run: |
          set +e
          failed=0

          run_gate() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a reports/public-switch-diagnostic.txt
            "$@" >> reports/public-switch-diagnostic.txt 2>&1
            code=$?
            echo "exit_code=$code" | tee -a reports/public-switch-diagnostic.txt
            echo | tee -a reports/public-switch-diagnostic.txt
            if [[ $code -ne 0 ]]; then
              failed=1
            fi
          }

          run_gate install \
            python -m pip install --disable-pip-version-check \
            -r papers/HINC-001/requirements.txt

          run_gate compile \
            python -m compileall -q \
            tools \
            papers/HINC-001/src \
            papers/HINC-001/tests

          run_gate publication_validator \
            python tools/validate_publication_v2.py \
            --root . \
            --json-output reports/publication-validation-diagnostic.json

          run_gate switch_validator \
            python tools/validate_public_release_v2.py \
            --root . \
            --json-output reports/public-switch-validation-diagnostic.json

          run_gate hinc_tests \
            python -m unittest discover \
            -s papers/HINC-001/tests \
            -p 'test_*.py' \
            -v

          git fetch origin main >> reports/public-switch-diagnostic.txt 2>&1
          base="$(git merge-base origin/main HEAD)"
          run_gate whitespace git diff --check "$base" HEAD --

          echo "overall_failed=$failed" | tee -a reports/public-switch-diagnostic.txt
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post diagnostic to PR #2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Temporary public-switch diagnostic"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Run: \`$GITHUB_RUN_ID\`"
            echo
            echo '<details open><summary>Captured output</summary>'
            echo
            echo '```text'
            tail -n 400 reports/public-switch-diagnostic.txt
            echo '```'
            echo
            echo '</details>'
          } > reports/public-switch-diagnostic-comment.md
          gh pr comment 2 \
            --repo "$GITHUB_REPOSITORY" \
            --body-file reports/public-switch-diagnostic-comment.md \
            --edit-last \
            --create-if-none

      - name: Upload temporary diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-switch-diagnostic-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce diagnostic result
        if: always()
        run: |
          test "${{ steps.diagnostic.outputs.failed }}" = "0"
