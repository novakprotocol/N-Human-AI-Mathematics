name: Validate private public-switch candidate

# Private hosted jobs currently fail before executing a step. This workflow is
# retained as a manual fail-closed gate for use when hosted execution is
# available again. The authoritative current private gate is the guarded local
# preflight in tools/Invoke-PublicSwitchPreflight.ps1.
on:
  workflow_dispatch:
    inputs:
      confirm_private_candidate:
        description: "Type VALIDATE-HINC-001 while the repository is PRIVATE"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require exact private-gate confirmation
        run: |
          test "${{ inputs.confirm_private_candidate }}" = "VALIDATE-HINC-001"

      - name: Check out the candidate branch
        uses: actions/checkout@v6
        with:
          ref: release/public-review-v1
          fetch-depth: 0

      - name: Verify repository remains private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" > /tmp/repository.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/repository.json").read_text())
          assert data["visibility"] == "private", data["visibility"]
          assert data["default_branch"] == "main", data["default_branch"]
          print("repository visibility: PRIVATE")
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install HINC requirements
        run: |
          python -m pip install --disable-pip-version-check \
            -r papers/HINC-001/requirements.txt

      - name: Compile all private-gate sources
        run: |
          python -m py_compile tools/validate_publication.py
          python -m py_compile tools/validate_publication_v2.py
          python -m py_compile tools/validate_public_release.py
          python -m py_compile tools/validate_public_release_v2.py
          python -m py_compile tools/validate_public_state.py
          python -m py_compile papers/HINC-001/src/standalone_common_core_verifier.py
          python -m py_compile papers/HINC-001/tests/test_hinc_standalone.py

      - name: Run private publication and switch-readiness validators
        run: |
          mkdir -p reports
          python tools/validate_publication_v2.py \
            --root . \
            --json-output reports/publication-validation.json
          python tools/validate_public_release_v2.py \
            --root . \
            --json-output reports/public-switch-validation.json

      - name: Run HINC standalone tests
        run: |
          python -m unittest discover \
            -s papers/HINC-001/tests \
            -p 'test_*.py' \
            -v 2>&1 | tee reports/hinc-standalone-test-log.txt

      - name: Check complete branch whitespace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$(git merge-base origin/main HEAD)"
          git diff --check "$BASE" HEAD --

      - name: Upload private validation receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-public-switch-validation-${{ github.run_id }}
          path: |
            reports/publication-validation.json
            reports/public-switch-validation.json
            reports/public-release-audit-2026-07-27.json
            reports/public-switch-readiness.json
            reports/hinc-standalone-test-log.txt
            reports/hosted-runner-availability-2026-07-27.json
          if-no-files-found: warn
          retention-days: 90
