name: Validate mathematical publication repository

on:
  push:
    branches:
      - main
      - release/public-review-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete source history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install HINC requirements
        run: |
          python -m pip install --disable-pip-version-check \
            -r papers/HINC-001/requirements.txt

      - name: Compile validators and HINC source
        run: |
          python -m py_compile tools/validate_publication.py
          python -m py_compile tools/validate_publication_v2.py
          python -m py_compile tools/validate_public_release.py
          python -m py_compile tools/validate_public_release_v2.py
          python -m py_compile tools/validate_public_state.py
          python -m py_compile tools/validate_publication_gate.py
          python -m py_compile papers/HINC-001/src/mcrc_hidden_infinitesimal_noncommutativity_standalone.py
          python -m py_compile papers/HINC-001/src/standalone_common_core_verifier.py
          python -m py_compile papers/HINC-001/tests/test_hinc_standalone.py

      - name: Verify repository visibility matches the recorded state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" > /tmp/repository.json
          python - <<'PY'
          import json
          from pathlib import Path

          repository = json.loads(Path("/tmp/repository.json").read_text())
          index = json.loads(Path("research-index.json").read_text(encoding="utf-8"))
          expected = "public" if index["public_release_authorized"] else "private"
          assert repository["visibility"] == expected, (
              expected,
              repository["visibility"],
          )
          assert repository["default_branch"] == "main"
          print(f"repository visibility: {expected.upper()}")
          PY

      - name: Validate publication and release boundaries
        run: |
          mkdir -p reports
          python tools/validate_publication_v2.py \
            --root . \
            --allow-public \
            --json-output reports/publication-validation-ci.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          index = json.loads(Path("research-index.json").read_text(encoding="utf-8"))
          if index["public_release_authorized"]:
              command = [
                  "python",
                  "tools/validate_public_state.py",
                  "--root",
                  ".",
                  "--json-output",
                  "reports/public-state-validation-ci.json",
              ]
          else:
              command = [
                  "python",
                  "tools/validate_public_release_v2.py",
                  "--root",
                  ".",
                  "--json-output",
                  "reports/public-review-validation-ci.json",
              ]
          subprocess.run(command, check=True)
          PY
          python tools/validate_publication_gate.py \
            --root . \
            --json-output reports/publication-gate-validation-ci.json

      - name: Run HINC standalone tests
        run: |
          python -m unittest discover \
            -s papers/HINC-001/tests \
            -p 'test_*.py' \
            -v 2>&1 | tee reports/hinc-test-log-ci.txt

      - name: Verify deterministic certificate identity
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, "papers/HINC-001/src")
          from mcrc_hidden_infinitesimal_noncommutativity_standalone import build_certificate

          expected = "20d883988da7818f73de0b4ccab68bc7adea5097a4af7a6ef5a72c23b4e1ea4b"
          actual = build_certificate(4)["evidence_sha256"]
          assert actual == expected, (expected, actual)
          print(actual)
          PY

      - name: Verify private-readiness or public-release state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("research-index.json").read_text(encoding="utf-8"))
          hinc = json.loads(Path("papers/HINC-001/STATUS.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("reports/public-release-audit-2026-07-27.json").read_text(encoding="utf-8"))
          readiness = json.loads(Path("reports/public-switch-readiness.json").read_text(encoding="utf-8"))

          assert index["public_switch_ready"] is True
          assert index["specific_model_disclosed"] is False
          assert index["specific_provider_disclosed"] is False
          assert hinc["release"]["public_switch_ready"] is True
          assert hinc["release"]["specific_model_disclosed"] is False
          assert hinc["release"]["specific_provider_disclosed"] is False

          if index["public_release_authorized"] is False:
              assert index["release_channel"] == "private_staging"
              assert index["release_version"] == "0.1.0-public-review-candidate"
              assert hinc["release"]["public_authorized"] is False
              assert hinc["release"]["channel"] == "private_staging"
              assert audit["result"] == "READY_PENDING_VISIBILITY_SWITCH"
              assert readiness["result"] == "READY_PENDING_VISIBILITY_SWITCH"
              print("private release-ready state: PASS")
          else:
              assert index["release_channel"] == "public_review"
              assert index["release_version"] == "0.1.0-public-review"
              assert hinc["release"]["public_authorized"] is True
              assert hinc["release"]["channel"] == "public_review"
              assert audit["result"] == "PUBLIC_RELEASED"
              assert readiness["result"] == "PUBLIC_RELEASED"
              print("public release state: PASS")
          PY

      - name: Check branch whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
            git diff --check "$BASE" HEAD --
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD --
          else
            git diff --check --
          fi

      - name: Upload publication receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-validation-${{ github.run_id }}
          path: |
            reports/publication-validation-ci.json
            reports/public-review-validation-ci.json
            reports/public-state-validation-ci.json
            reports/publication-gate-validation-ci.json
            reports/hinc-test-log-ci.txt
            reports/public-release-audit-2026-07-27.json
            reports/public-switch-readiness.json
          if-no-files-found: warn
          retention-days: 90

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out formal source
        uses: actions/checkout@v7

      - name: Reject proof placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' \
              papers/HINC-001/formal --include='*.lean'; then
            echo "Lean placeholder found" >&2
            exit 1
          fi

      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@v1.5.0
        with:
          lake-package-directory: papers/HINC-001/formal
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Update dependencies and build pinned Lean package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cd papers/HINC-001/formal
          lake update 2>&1 | tee ../../../reports/hinc-lean-update-ci.txt
          lake exe cache get 2>&1 | tee ../../../reports/hinc-lean-cache-ci.txt
          lake build 2>&1 | tee ../../../reports/hinc-lean-build-ci.txt

      - name: Upload Lean build receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hinc-lean-validation-${{ github.run_id }}
          path: |
            reports/hinc-lean-update-ci.txt
            reports/hinc-lean-cache-ci.txt
            reports/hinc-lean-build-ci.txt
          if-no-files-found: warn
          retention-days: 90
