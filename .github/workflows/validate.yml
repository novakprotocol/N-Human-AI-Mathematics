name: Validate mathematical publication repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validation sources
        run: |
          python -m py_compile tools/validate_publication.py
          python -m py_compile tools/validate_public_release.py
          python -m py_compile tools/validate_public_release_v2.py

      - name: Validate structure, status, claims, and source hygiene
        run: |
          mkdir -p reports
          python tools/validate_publication.py \
            --root . \
            --allow-public \
            --json-output reports/publication-validation.json
          python tools/validate_public_release_v2.py \
            --root . \
            --json-output reports/public-review-validation.json

      - name: Check complete branch whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          git diff --check "$BASE" HEAD

      - name: Verify public-release declarations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("research-index.json").read_text(encoding="utf-8"))
          hinc = json.loads(Path("papers/HINC-001/STATUS.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("reports/public-release-audit-2026-07-27.json").read_text(encoding="utf-8"))

          assert index["public_release_authorized"] is True
          assert index["release_channel"] == "public_review"
          assert hinc["release"]["public_authorized"] is True
          assert hinc["release"]["version"] == "0.1.0-public-review"
          assert audit["result"] == "PASS_WITH_DECLARED_LIMITATIONS"
          assert audit["release_scope"]["peer_reviewed"] is False
          assert audit["release_scope"]["openai_endorsement_claimed"] is False
          print("public-review declarations: PASS")
          PY

      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-validation-${{ github.run_id }}
          path: |
            reports/publication-validation.json
            reports/public-review-validation.json
            reports/public-release-audit-2026-07-27.json
          if-no-files-found: warn
          retention-days: 90
