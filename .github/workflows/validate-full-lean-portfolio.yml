name: Validate full-portfolio Lean policy

on:
  pull_request:
    branches: [main]
    paths:
      - 'FULL_LEAN_VERIFICATION_PROGRAM.md'
      - 'formal-verification-status.json'
      - 'papers/HINC-001/FORMAL_VERIFICATION.md'
      - 'papers/ABF-001/FORMAL_VERIFICATION.md'
      - 'docs/index.html'
      - 'docs/learn.html'
      - 'tools/validate_full_lean_portfolio.py'
      - '.github/workflows/validate-full-lean-portfolio.yml'
  push:
    branches: [main]
    paths:
      - 'FULL_LEAN_VERIFICATION_PROGRAM.md'
      - 'formal-verification-status.json'
      - 'papers/HINC-001/FORMAL_VERIFICATION.md'
      - 'papers/ABF-001/FORMAL_VERIFICATION.md'
      - 'docs/index.html'
      - 'docs/learn.html'
      - 'tools/validate_full_lean_portfolio.py'
      - '.github/workflows/validate-full-lean-portfolio.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Immutable commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact workflow checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            expected="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            expected="${{ inputs.target_sha }}"
          else
            expected="${{ github.sha }}"
          fi
          actual="$(git rev-parse HEAD)"
          echo "event=${{ github.event_name }}"
          echo "expected_sha=$expected"
          echo "actual_checked_out_sha=$actual"
          test "$actual" = "$expected"
          mkdir -p .artifacts/exact-head
          python - <<PY
          import json
          from pathlib import Path

          payload = {
              "schema": "nhaim.workflow_exact_head_checkout.v1",
              "event": "${{ github.event_name }}",
              "expected_sha": "$expected",
              "actual_checked_out_sha": "$actual",
              "match": "$actual" == "$expected",
          }
          path = Path(".artifacts/exact-head/${{ github.job }}-checkout.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate portfolio formal boundaries
        run: |
          set -euo pipefail
          mkdir -p .artifacts/full-lean-portfolio
          python -m py_compile tools/validate_full_lean_portfolio.py
          python tools/validate_full_lean_portfolio.py \
            --root . \
            --output .artifacts/full-lean-portfolio/validation.json \
            | tee .artifacts/full-lean-portfolio/validation.stdout

      - name: Validate JSON and whitespace
        run: |
          set -euo pipefail
          python -m json.tool formal-verification-status.json >/dev/null
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
            git diff --check "$base" HEAD --
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD --
          else
            git diff --check --
          fi

      - name: Upload policy receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-lean-portfolio-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          path: |
            .artifacts/full-lean-portfolio/
            .artifacts/exact-head/
          if-no-files-found: error
          retention-days: 90
