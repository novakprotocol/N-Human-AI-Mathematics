name: Validate repository status consistency

on:
  pull_request:
    branches: [main]
    paths:
      - 'STATUS.md'
      - 'AGENTS.md'
      - 'PUBLIC_REVIEW_RELEASE.md'
      - 'PUBLIC_REVIEW_FORMALIZATION_HOLD_2026-07-29.md'
      - 'FULL_LEAN_VERIFICATION_PROGRAM.md'
      - 'FSG_001_PUBLIC_TEACHING_HOLD_2026-07-29.md'
      - 'FULL_LEAN_RELEASE_STANDARD.md'
      - 'PAPER_1_3_FULL_LEAN_STATUS.json'
      - 'formal-verification-status.json'
      - 'research-index.json'
      - 'schemas/**'
      - 'papers/HINC-001/STATUS.json'
      - 'papers/HINC-001/FORMAL_VERIFICATION.md'
      - 'papers/ABF-001/STATUS.json'
      - 'papers/ABF-001/FORMAL_VERIFICATION.md'
      - 'papers/ABF-001/formal/FORMAL_STATUS_V1.json'
      - 'reports/publication-gates/HINC-001.json'
      - 'reports/publication-gates/ABF-001.json'
      - 'docs/index.html'
      - 'docs/learn.html'
      - 'tools/public_status_checks.py'
      - 'tools/validate_status_consistency.py'
      - 'tools/validate_json_schema.py'
      - 'tools/validate_internal_links.py'
      - 'tools/validate_public_surface_scan.py'
      - 'tools/test_public_status_mutations.py'
      - 'tools/test_json_schema_negative_controls.py'
      - 'tools/test_internal_link_negative_control.py'
      - 'requirements-validation.txt'
      - '.github/workflows/validate-status-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'STATUS.md'
      - 'AGENTS.md'
      - 'PUBLIC_REVIEW_RELEASE.md'
      - 'PUBLIC_REVIEW_FORMALIZATION_HOLD_2026-07-29.md'
      - 'FULL_LEAN_VERIFICATION_PROGRAM.md'
      - 'FSG_001_PUBLIC_TEACHING_HOLD_2026-07-29.md'
      - 'FULL_LEAN_RELEASE_STANDARD.md'
      - 'PAPER_1_3_FULL_LEAN_STATUS.json'
      - 'formal-verification-status.json'
      - 'research-index.json'
      - 'schemas/**'
      - 'papers/HINC-001/STATUS.json'
      - 'papers/HINC-001/FORMAL_VERIFICATION.md'
      - 'papers/ABF-001/STATUS.json'
      - 'papers/ABF-001/FORMAL_VERIFICATION.md'
      - 'papers/ABF-001/formal/FORMAL_STATUS_V1.json'
      - 'reports/publication-gates/HINC-001.json'
      - 'reports/publication-gates/ABF-001.json'
      - 'docs/index.html'
      - 'docs/learn.html'
      - 'tools/public_status_checks.py'
      - 'tools/validate_status_consistency.py'
      - 'tools/validate_json_schema.py'
      - 'tools/validate_internal_links.py'
      - 'tools/validate_public_surface_scan.py'
      - 'tools/test_public_status_mutations.py'
      - 'tools/test_json_schema_negative_controls.py'
      - 'tools/test_internal_link_negative_control.py'
      - 'requirements-validation.txt'
      - '.github/workflows/validate-status-consistency.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Immutable commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact workflow checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            expected="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            expected="${{ inputs.target_sha }}"
          else
            expected="${{ github.sha }}"
          fi
          actual="$(git rev-parse HEAD)"
          echo "event=${{ github.event_name }}"
          echo "expected_sha=$expected"
          echo "actual_checked_out_sha=$actual"
          test "$actual" = "$expected"
          mkdir -p .artifacts/exact-head
          python - <<PY
          import json
          from pathlib import Path

          payload = {
              "schema": "nhaim.workflow_exact_head_checkout.v1",
              "event": "${{ github.event_name }}",
              "expected_sha": "$expected",
              "actual_checked_out_sha": "$actual",
              "match": "$actual" == "$expected",
          }
          path = Path(".artifacts/exact-head/${{ github.job }}-checkout.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation requirements
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate publication and formal-state consistency
        run: |
          set -euo pipefail
          mkdir -p .artifacts/status-consistency
          python -m py_compile \
            tools/public_status_checks.py \
            tools/validate_status_consistency.py \
            tools/validate_json_schema.py \
            tools/validate_internal_links.py \
            tools/validate_public_surface_scan.py \
            tools/test_public_status_mutations.py \
            tools/test_json_schema_negative_controls.py \
            tools/test_internal_link_negative_control.py
          python tools/validate_status_consistency.py \
            --root . \
            --scan-all \
            --output .artifacts/status-consistency/validation.json \
            | tee .artifacts/status-consistency/validation.stdout
          python tools/validate_json_schema.py \
            --root . \
            --output .artifacts/status-consistency/json-schema.json \
            | tee .artifacts/status-consistency/json-schema.stdout
          python tools/validate_internal_links.py \
            --root . \
            --output .artifacts/status-consistency/internal-links.json \
            | tee .artifacts/status-consistency/internal-links.stdout
          python tools/test_json_schema_negative_controls.py \
            --root . \
            --output .artifacts/status-consistency/json-schema-negative-controls.json \
            | tee .artifacts/status-consistency/json-schema-negative-controls.stdout
          python tools/test_internal_link_negative_control.py \
            --root . \
            --output .artifacts/status-consistency/internal-link-negative-control.json \
            | tee .artifacts/status-consistency/internal-link-negative-control.stdout
          python tools/test_public_status_mutations.py \
            --root . \
            --output .artifacts/status-consistency/mutation-tests.json \
            --log .artifacts/status-consistency/mutation-tests.log \
            | tee .artifacts/status-consistency/mutation-tests.stdout
          python tools/validate_public_surface_scan.py \
            --root . \
            --output .artifacts/status-consistency/public-surface-scan.json \
            | tee .artifacts/status-consistency/public-surface-scan.stdout

      - name: Validate JSON and whitespace
        run: |
          set -euo pipefail
          python -m json.tool PAPER_1_3_FULL_LEAN_STATUS.json >/dev/null
          python -m json.tool formal-verification-status.json >/dev/null
          python -m json.tool research-index.json >/dev/null
          python -m json.tool papers/HINC-001/STATUS.json >/dev/null
          python -m json.tool papers/ABF-001/STATUS.json >/dev/null
          python -m json.tool papers/ABF-001/formal/FORMAL_STATUS_V1.json >/dev/null
          python -m json.tool reports/publication-gates/HINC-001.json >/dev/null
          python -m json.tool reports/publication-gates/ABF-001.json >/dev/null
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
            git diff --check "$base" HEAD --
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD --
          else
            git diff --check --
          fi

      - name: Upload consistency receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-consistency-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          path: |
            .artifacts/status-consistency/
            .artifacts/exact-head/
          if-no-files-found: error
          retention-days: 90
